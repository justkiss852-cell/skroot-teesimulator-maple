name: Build SKRoot TEESimulator-RS MapleSU module

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4

      - name: Fetch SKRoot SDK
        run: |
          git clone --depth 1 https://github.com/abcz316/SKRoot-linuxKernelRoot.git skroot

      - name: Copy module into SKRoot tree
        run: |
          mkdir -p "skroot/Pro(众测开放中)/src/testModule"
          cp -r module_teesimulator_maple "skroot/Pro(众测开放中)/src/testModule/"

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r26d
          add-to-path: true

      - name: Build .so
        run: |
          cd "skroot/Pro(众测开放中)/src/testModule/module_teesimulator_maple/jni"
          ndk-build -j4
          ls -l ../libs/arm64-v8a/

      - name: Package module zip
        run: |
          cd "skroot/Pro(众测开放中)/src/testModule/module_teesimulator_maple"
          chmod +x ./pack.sh
          ./pack.sh
          ls -lh module_TEESimulator_MapleSU_SKRoot.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: module_TEESimulator_MapleSU_SKRoot
          path: "skroot/Pro(众测开放中)/src/testModule/module_teesimulator_maple/module_TEESimulator_MapleSU_SKRoot.zip"
