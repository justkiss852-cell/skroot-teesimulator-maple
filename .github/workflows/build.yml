name: Build SKRoot TEESimulator-RS MapleSU module

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4

      - name: Fetch SKRoot SDK
        run: |
          git clone --depth 1 https://github.com/abcz316/SKRoot-linuxKernelRoot.git skroot

      # ndk-build 的中间路径不能带括号，SDK 里的 "Pro(众测开放中)" 会直接把 make 搞挂，
      # 所以把 SDK 的 kernel_module_kit 和本模块一起拷到无括号的 work/ 下再编。
      - name: Copy SDK + module to a paren-free path
        run: |
          mkdir -p work
          cp -r "skroot/Pro(众测开放中)/src/testModule/kernel_module_kit" work/
          cp -r module_teesimulator_maple work/
          ls work

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r26d
          add-to-path: true

      - name: Build .so
        run: |
          cd work/module_teesimulator_maple/jni
          ndk-build -j4
          ls -l ../libs/arm64-v8a/

      - name: Package module zip
        run: |
          cd work/module_teesimulator_maple
          chmod +x ./pack.sh
          ./pack.sh
          ls -lh module_TEESimulator_MapleSU_SKRoot.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: module_TEESimulator_MapleSU_SKRoot
          path: work/module_teesimulator_maple/module_TEESimulator_MapleSU_SKRoot.zip
